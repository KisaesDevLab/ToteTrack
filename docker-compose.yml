# Production deployment: app + postgres, two named volumes. Zero configuration required:
#   docker compose up -d --build   →  open http://localhost:3000, set a PIN, then configure
#   everything else (Anthropic key, Cloudflare tunnel token, public address, labels…) in Settings.
# .env values are optional overrides — see .env.example.
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: ${TOTETRACK_IMAGE:-totetrack:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tote:${POSTGRES_PASSWORD:-totetrack}@postgres:5432/totetrack
      # All optional — leave empty to manage from the Settings page (secret is auto-generated).
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PHOTO_DIR: /data/photos
      PORT: '3000'
    ports:
      # Bind to loopback only; the Cloudflare Tunnel (cloudflared) runs on the same host.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - photos:/data/photos
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tote
      # Postgres is only reachable inside the compose network; override in .env if you expose it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-totetrack}
      POSTGRES_DB: totetrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tote -d totetrack']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  photos:
