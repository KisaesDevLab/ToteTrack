# ToteTrack — run from the published image, no repo checkout needed.
#
#   mkdir -p ~/totetrack && cd ~/totetrack
#   curl -fsSLO https://raw.githubusercontent.com/KisaesDevLab/ToteTrack/main/deploy/docker-compose.yml
#   docker compose up -d
#
# Then open http://<host>:3000, set a PIN, and configure everything else in Settings
# (Anthropic key, Cloudflare tunnel token, public address, labels…). No .env required.
# Optional overrides (put in a .env next to this file): TOTETRACK_TAG, APP_PORT, APP_BIND,
# POSTGRES_PASSWORD, and any of the env vars listed in the README.
services:
  app:
    image: ghcr.io/kisaesdevlab/totetrack:${TOTETRACK_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tote:${POSTGRES_PASSWORD:-totetrack}@postgres:5432/totetrack
      # All optional — leave empty to manage from the Settings page (secret is auto-generated).
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      PHOTO_DIR: /data/photos
      PORT: '3000'
    ports:
      # 0.0.0.0 so phones on your LAN can reach it; the Cloudflare tunnel (Settings) works either way.
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000'
    volumes:
      - photos:/data/photos
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-totetrack}
      POSTGRES_DB: totetrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tote -d totetrack']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  photos:
